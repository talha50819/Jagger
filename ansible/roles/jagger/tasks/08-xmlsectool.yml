---
- name: Install Java (required by XMLSecTool)
  ansible.builtin.apt:
    name: default-jdk
    state: present

- name: Create the XMLSecTool install directory
  ansible.builtin.file:
    path: "{{ xmlsectool_install_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

# Vendored in roles/jagger/files/ instead of fetched from shibboleth.net at
# run time: that server has proven unreliable for this specific 19MB file -
# TLS negotiation and/or bulk transfers to it stall or reset mid-download,
# reproduced independently across multiple unrelated networks. The
# vendored copy is the exact official 4.0.0 release build, verified against
# the checksum shibboleth.net itself publishes
# (sha1: 0c7369cf70ca5da2e623ca4fa02cd0913151428c) before being committed.
# unarchive copies it from the control machine and extracts it in one step
# - no network dependency on the target host at all for this step.
- name: Unpack the vendored XMLSecTool {{ xmlsectool_version }} archive
  ansible.builtin.unarchive:
    src: "xmlsectool-{{ xmlsectool_version }}-bin.zip"
    dest: "{{ xmlsectool_install_dir }}"
    owner: root
    group: root
    creates: "{{ xmlsectool_install_dir }}/xmlsectool-{{ xmlsectool_version }}/xmlsectool.jar"

- name: Deploy the xmlsectool wrapper script
  ansible.builtin.template:
    src: xmlsectool-wrapper.sh.j2
    dest: /usr/local/bin/xmlsectool
    owner: root
    group: root
    mode: "0755"
