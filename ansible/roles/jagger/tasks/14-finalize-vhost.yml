---
# Checked fresh here (rather than trusting 06-letsencrypt.yml's fact) so this
# is safe even if that file was skipped this run, e.g. via --skip-tags
# letsencrypt - which only skips *obtaining* a cert, not this vhost step.
- name: Check whether a Let's Encrypt certificate actually exists
  ansible.builtin.stat:
    path: "/etc/letsencrypt/live/{{ jagger_fqdn }}/fullchain.pem"
  register: jagger_vhost_cert

- name: Template the Jagger SSL VirtualHost
  ansible.builtin.template:
    src: jagger-le-ssl.conf.j2
    dest: "/etc/apache2/sites-available/{{ jagger_fqdn }}-le-ssl.conf"
    owner: root
    group: root
    mode: "0644"
  when: letsencrypt_enabled | bool and jagger_vhost_cert.stat.exists
  tags: [letsencrypt]
  notify: restart apache

- name: Enable the Jagger SSL VirtualHost
  ansible.builtin.command:
    cmd: "a2ensite {{ jagger_fqdn }}-le-ssl.conf"
    creates: "/etc/apache2/sites-enabled/{{ jagger_fqdn }}-le-ssl.conf"
  when: letsencrypt_enabled | bool and jagger_vhost_cert.stat.exists
  tags: [letsencrypt]
  notify: restart apache

- name: Warn if letsencrypt_enabled is true but no certificate was found
  ansible.builtin.debug:
    msg: >-
      letsencrypt_enabled is true but no certificate exists yet at
      /etc/letsencrypt/live/{{ jagger_fqdn }}/fullchain.pem (did you run with
      --skip-tags letsencrypt before one was ever obtained, or did issuance
      fail?). Falling back to a plain HTTP vhost for now. To fix properly:
      re-run without --skip-tags letsencrypt so a cert can be obtained, or
      set -e letsencrypt_enabled=false if this is intentionally a lab/dev box.
  when: letsencrypt_enabled | bool and not jagger_vhost_cert.stat.exists

# Plain HTTP instead: either letsencrypt_enabled is false (lab/dev, no public
# DNS), or it's true but no certificate exists yet (see warning above).
- name: Template the Jagger HTTP-only VirtualHost (no TLS)
  ansible.builtin.template:
    src: jagger-http.conf.j2
    dest: "/etc/apache2/sites-available/{{ jagger_fqdn }}.conf"
    owner: root
    group: root
    mode: "0644"
  when: not (letsencrypt_enabled | bool) or not jagger_vhost_cert.stat.exists
  notify: restart apache

- name: Enable the Jagger HTTP-only VirtualHost
  ansible.builtin.command:
    cmd: "a2ensite {{ jagger_fqdn }}.conf"
    creates: "/etc/apache2/sites-enabled/{{ jagger_fqdn }}.conf"
  when: not (letsencrypt_enabled | bool) or not jagger_vhost_cert.stat.exists
  notify: restart apache

- name: Validate the Apache configuration
  ansible.builtin.command:
    cmd: apache2ctl configtest
  changed_when: false
