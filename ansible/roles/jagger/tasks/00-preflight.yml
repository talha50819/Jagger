---
- name: Assert supported OS family
  ansible.builtin.assert:
    that:
      - ansible_facts['os_family'] == 'Debian'
    fail_msg: "This role supports Debian/Ubuntu only (found {{ ansible_facts['os_family'] }})."

- name: Assert required secrets are set
  ansible.builtin.assert:
    that:
      - jagger_db_password != "CHANGE_ME"
      - jagger_encryption_key != "CHANGE_ME_64_CHARS"
      - jagger_syncpass != "CHANGE_ME_64_CHARS"
    fail_msg: >-
      jagger_db_password / jagger_encryption_key / jagger_syncpass are unset.
      Copy group_vars/jagger_servers/vault.yml.example to vault.yml, fill in real
      secrets, and encrypt it with `ansible-vault encrypt`.
  no_log: true

- name: Install python3-pymysql (required by the community.mysql modules used later)
  ansible.builtin.apt:
    name: python3-pymysql
    state: present
    update_cache: true
    cache_valid_time: 3600
