---
- name: Assert supported OS family
  ansible.builtin.assert:
    that:
      - ansible_facts['os_family'] == 'Debian'
    fail_msg: "This role supports Debian/Ubuntu only (found {{ ansible_facts['os_family'] }})."

- name: Ensure the local secrets directory exists (used to persist auto-generated secrets)
  ansible.builtin.file:
    path: "{{ jagger_secrets_dir }}"
    state: directory
    mode: "0700"
  delegate_to: localhost
  become: false

- name: Note where secrets live (values are never logged)
  ansible.builtin.debug:
    msg: >-
      jagger_db_password / jagger_encryption_key / jagger_syncpass: using
      vault_* overrides where set, auto-generated and persisted under
      {{ jagger_secrets_dir }}/ on the control machine otherwise. Not
      committed to git - see ansible/.gitignore.

- name: Install python3-pymysql (required by the community.mysql modules used later)
  ansible.builtin.apt:
    name: python3-pymysql
    state: present
    update_cache: true
    cache_valid_time: 3600
